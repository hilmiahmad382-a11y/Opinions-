
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English Help Expressions Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg,#74ebd5,#9face6);
    margin:0;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
}

.question{
    background:#f8f9ff;
    padding:15px;
    margin-bottom:15px;
    border-left:6px solid #6c63ff;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    background:#6c63ff;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:15px;
    padding:15px;
    background:#eaffea;
    border-left:6px solid #2ecc71;
    border-radius:10px;
}

/* POPUP STYLE */
#popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:white;
    padding:20px;
    width:80%;
    max-width:600px;
    border-radius:12px;
    max-height:80%;
    overflow-y:auto;
}

.popup-content h2{
    margin-top:0;
}

.close-btn{
    background:#ff4d4d;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    float:right;
}
</style>
</head>

<body>

<div class="container">

<h1>🌟 English Help Expressions Quiz</h1>

<input id="name" placeholder="Name">
<br><br>
<input id="class" placeholder="Class">

<!-- QUESTIONS -->
<div class="question">1. Can you help me?<br>
<input type="radio" name="q1" value="b"> asking for help<br>
<input type="radio" name="q1" value="a"> greeting
</div>

<div class="question">2. Offer help:<br>
<input type="radio" name="q2" value="a"> Let me help you<br>
<input type="radio" name="q2" value="b"> I disagree
</div>

<div class="question">3. Would you mind helping me?<br>
<input type="radio" name="q3" value="b"> polite<br>
<input type="radio" name="q3" value="a"> rude
</div>

<div class="question">4. Books are heavy:<br>
<input type="radio" name="q4" value="b"> Let me carry them<br>
<input type="radio" name="q4" value="a"> I’m sorry
</div>

<div class="question">5. Polite request:<br>
<input type="radio" name="q5" value="b"> Could you help me, please?<br>
<input type="radio" name="q5" value="a"> Help me!
</div>

<button onclick="submitQuiz()">Submit</button>

<div class="result" id="result"></div>

</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-content">
    <button class="close-btn" onclick="closePopup()">X</button>
    <h2>📘 Answer Explanations</h2>
    <div id="explanations"></div>
  </div>
</div>

<script>

const answers = {
q1:"b",
q2:"a",
q3:"b",
q4:"b",
q5:"b"
};

const explanations = {
q1:"'Can you help me?' means asking someone for help.",
q2:"'Let me help you' is offering assistance.",
q3:"'Would you mind...' is a polite expression.",
q4:"Offering to carry books shows help.",
q5:"'Could you help me, please?' is a polite request."
};

function submitQuiz(){
let score = 0;
let explanationHTML = "";

for(let i=1;i<=5;i++){
let q = document.querySelector('input[name="q'+i+'"]:checked');

if(q && q.value === answers["q"+i]){
score++;
explanationHTML += `<p>✔ Q${i}: Correct - ${explanations["q"+i]}</p>`;
} else {
explanationHTML += `<p>❌ Q${i}: Wrong - ${explanations["q"+i]}</p>`;
}
}

let name = document.getElementById("name").value;
let cls = document.getElementById("class").value;
let time = new Date().toLocaleString();

document.getElementById("result").innerHTML = `
<h3>🎯 Result</h3>
Name: ${name}<br>
Class: ${cls}<br>
Score: ${score}/5<br>
Time: ${time}
`;

/* SAVE RANKING */
let ranking = JSON.parse(localStorage.getItem("ranking")) || [];
ranking.push({name, class:cls, score, time});
localStorage.setItem("ranking", JSON.stringify(ranking));

showPopup(explanationHTML);
}

function showPopup(html){
document.getElementById("explanations").innerHTML = html;
document.getElementById("popup").style.display = "flex";
}

function closePopup(){
document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
